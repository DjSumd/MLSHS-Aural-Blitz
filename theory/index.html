<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Theory Blitz</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root{--bg:#1b1a18;--ink:#1b1a18;--paper:#f6f1e7;--paper2:#efe8da;--line:#262421;--muted:#7a7267;--rule:#d8d0c1;--shade:#ebe4d6;
    --ox:#8c2b22;--brass:#b2862f;--green:#3d6b45;--red:#a3322a;--accent:#8c2b22;--cream:#efe9dc;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
  header{padding:calc(10px + env(safe-area-inset-top,0)) 14px 4px;color:var(--cream)}
  header .wrap{max-width:960px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--ox),var(--brass),#2e86c1,#27ae60,var(--ox)) 1}
  header .eye{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:#b8b0a2;font-weight:600}
  header h1{margin:0;font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.2px;line-height:1;color:var(--cream)}
  header h1 .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brass);margin-left:6px;vertical-align:middle;transform:translateY(-4px)}
  .hud{display:flex;align-items:center;gap:18px;color:var(--cream);font-size:12px}
  .hud .stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:56px}
  .hud .stat .lbl{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#a79f91}
  .hud .stat .val{font-family:var(--serif);font-size:24px;line-height:1;font-weight:600;color:var(--cream)}
  .hud .stat .val.brass{color:var(--brass)}
  .hud .rst{background:transparent;border:1px solid rgba(239,233,220,.3);color:#cfc8ba;border-radius:999px;font-size:11px;font-weight:600;padding:5px 11px;cursor:pointer;font-family:var(--sans)}
  .hud .rst:hover{border-color:var(--cream);color:var(--cream)}
  .xp{height:3px;width:56px;background:rgba(239,233,220,.15);overflow:hidden;margin-top:3px}
  .xp i{display:block;height:100%;width:0;background:var(--brass);transition:width .4s}
  main{max-width:960px;width:100%;margin:0 auto;padding:4px 14px 6px;flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 2px;flex:none}
  .topbar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .modebar{display:flex;gap:2px;border:1px solid rgba(239,233,220,.25);border-radius:999px;padding:3px;width:max-content}
  .modebar button{border:0;background:transparent;color:#cfc8ba;font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;font-family:var(--sans);letter-spacing:.3px}
  .modebar button.on{background:var(--cream);color:var(--ink)}
  .yearbar .ylab{color:#a79f91;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;padding:0 6px 0 10px;align-self:center}
  .yearbar button{padding:7px 11px} .yearbar button.on{background:var(--brass);color:var(--ink)}
  .gear{border:1px solid rgba(239,233,220,.3);background:transparent;color:#cfc8ba;border-radius:999px;padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
  .gear:hover{border-color:var(--cream);color:var(--cream)}
  .namebar{display:flex;align-items:center;gap:7px;color:#cfc8ba;font-size:12px}
  .namebar input{border:1px solid rgba(239,233,220,.3);background:transparent;color:var(--cream);border-radius:999px;padding:6px 13px;font-size:13px;font-family:var(--sans);width:170px;outline:none}
  .namebar input::placeholder{color:#8f877a} .namebar input:focus{border-color:var(--cream)}
  .avbtn{display:flex;align-items:center;gap:8px;border:1px solid rgba(239,233,220,.3);background:transparent;border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;color:#cfc8ba;font-family:var(--sans);font-size:12px}
  .avbtn:hover{border-color:var(--cream)} .avbtn svg{width:34px;height:34px;border-radius:50%;display:block}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 6px;-webkit-overflow-scrolling:touch;flex:none;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;border:1px solid rgba(239,233,220,.22);background:transparent;color:#d7d0c2;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:var(--sans)}
  .tabs button:hover{border-color:rgba(239,233,220,.6)}
  .tabs button.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
  .tabs button .pc{font-size:10.5px;opacity:.7;margin-left:5px}
  .dots{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 8px;flex:none;align-items:center}
  .dots .d{width:11px;height:11px;border-radius:50%;border:1px solid rgba(239,233,220,.45);background:transparent;cursor:pointer}
  .dots .d.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--brass)}
  .dots .d.ok{background:#2ecc71;border-color:#2ecc71} .dots .d.no{background:#e74c3c;border-color:#e74c3c}
  .dots .newset{margin-left:auto;border:1px solid rgba(239,233,220,.3);background:transparent;color:#cfc8ba;border-radius:999px;font-size:11px;font-weight:600;padding:5px 11px;cursor:pointer;font-family:var(--sans)}
  .card{background:var(--paper);border-radius:6px;padding:16px 18px 14px;border-top:5px solid var(--accent);flex:1;min-height:0;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .qnum{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700}
  .prompt{font-family:var(--serif);font-size:24px;font-weight:600;margin:3px 0 2px;line-height:1.15;letter-spacing:.1px}
  .sub{font-size:13.5px;color:#4d463c;margin:0 0 8px}
  .howbtn{display:inline-flex;align-items:center;gap:6px;margin:2px 6px 8px 0;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .howbtn:hover{border-color:var(--ink)}
  .gback{position:fixed;inset:0;background:rgba(14,13,12,.6);z-index:69;display:none} .gback.open{display:block}
  .guide{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,92vw);max-height:84vh;overflow:auto;background:var(--paper);border-radius:6px;border-top:4px solid var(--accent);padding:18px 22px;z-index:70;display:none;box-shadow:0 24px 70px rgba(0,0,0,.5);font-size:14px;line-height:1.55}
  .guide.open{display:block}
  .guide b{color:#222} .guide ol,.guide ul{margin:6px 0 0;padding-left:20px} .guide li{margin:5px 0}
  .guide .gclose{position:absolute;top:10px;right:12px;border:0;background:var(--shade);border-radius:999px;width:30px;height:30px;font-size:15px;cursor:pointer}
  .showbox{display:flex;justify-content:center;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:6px 8px;margin:2px 0 10px;overflow-x:auto}
  .showbox svg{height:118px;width:auto;max-width:100%} .showbox.tall svg{height:150px} .showbox.long svg{height:auto;width:100%;max-height:220px}
  .legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:-4px 0 10px;font-size:12px;color:#4d463c}
  .legend .lab{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .legend .lgitem{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:2px 8px 2px 2px} .legend svg{height:56px;width:auto}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .toolbar .lab{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .acc{display:flex;gap:5px;flex-wrap:wrap}
  .acc button{min-width:42px;height:38px;border:1px solid var(--rule);background:#fff;border-radius:6px;font-size:19px;cursor:pointer;line-height:1;font-family:Georgia,serif;padding:0 8px}
  .acc button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .acc button.erase{font-size:12px;font-weight:700;font-family:var(--sans)}
  .ksb{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:6px;padding:3px 6px;background:#fff}
  .ksb button{min-width:36px;height:32px;border:1px solid var(--rule);background:#fff;border-radius:4px;font-size:17px;cursor:pointer;font-family:Georgia,serif}
  .ksb .ksv{min-width:92px;text-align:center;font-weight:600;font-size:12.5px}
  .staveWrap{width:100%;background:#fff;border-radius:6px;border:1px solid var(--rule);touch-action:none;overflow-x:auto}
  .staveWrap svg{display:block;height:200px;width:auto;max-width:none;margin:0 auto}
  .hint{font-size:12px;color:var(--muted);margin:8px 2px 0}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px}
  .opts.svgopts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .opts button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:6px;padding:11px 13px;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--sans)}
  .opts button svg{height:86px;width:auto;max-width:100%}
  .opts.svgopts button{flex-direction:column;align-items:center;gap:4px;padding:8px}
  .opts button:hover:not(:disabled){border-color:var(--ink)}
  .opts button .k{flex:0 0 auto;width:22px;height:22px;border-radius:4px;background:var(--shade);color:#5b554a;font-size:11.5px;font-weight:700;display:grid;place-items:center}
  .opts button.ok{background:#e6efe5;border-color:var(--green);color:#1f4a27} .opts button.ok .k{background:var(--green);color:#fff}
  .opts button.no{background:#f5e3e0;border-color:var(--red);color:#7a241d} .opts button.no .k{background:var(--red);color:#fff}
  .opts button:disabled{cursor:default}
  .match{display:flex;flex-direction:column;gap:9px}
  .mrow{display:flex;align-items:center;gap:10px}
  .mrow .term{flex:0 0 40%;font-weight:600;font-size:15px}
  .mrow select{flex:1 1 auto;min-width:0;padding:10px 9px;border:1px solid var(--rule);border-radius:6px;font-size:14px;font-family:var(--sans);background:#fff;cursor:pointer}
  .mrow.ok select{border-color:var(--green);background:#e6efe5} .mrow.no select{border-color:var(--red);background:#f5e3e0}
  .names{margin-top:10px;font-size:15px;font-weight:600;color:var(--ox);letter-spacing:.3px;display:none}
  .controls{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .controls button{flex:1 1 auto;min-width:110px;border-radius:6px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--ink);font-family:var(--sans)}
  .btn-check{background:var(--ink);color:var(--cream)} .btn-ghost{background:transparent;color:var(--ink)} .btn-ans{background:transparent;color:var(--ox);border-color:var(--ox)!important}
  .feedback{margin-top:14px;font-family:var(--serif);font-size:21px;font-weight:600;min-height:22px;line-height:1.2}
  .feedback.ok{color:var(--green)} .feedback.no{color:var(--red)}
  .why{font-family:var(--sans);font-size:13.5px;color:#4d463c;font-weight:400;margin-top:5px;line-height:1.5}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .nav button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:9px 17px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .nav button:disabled{opacity:.35;cursor:default} .nav .pos{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
  /* reference */
  .cofwrap{display:flex;justify-content:center;margin:4px 0 12px} svg.cof{width:100%;max-width:440px;height:auto}
  svg.cof .seg{cursor:pointer;transition:opacity .12s} svg.cof .seg:hover{opacity:.82} svg.cof .seg.sel{stroke:#1b1a18;stroke-width:5}
  .cofdetail{background:var(--paper2);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;font-size:15px;font-weight:600;text-align:center}
  .cofdetail svg{height:80px;width:auto;margin:6px 4px 0}
  .refnote{font-size:12.5px;color:#4d463c;margin-top:10px;text-align:center}
  .reftable{overflow-x:auto;margin:8px 0} .reftable table{width:100%;border-collapse:collapse;font-size:13.5px}
  .reftable th{background:var(--ink);color:var(--cream);text-align:left;padding:7px 10px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:600}
  .reftable td{border-bottom:1px solid var(--rule);padding:7px 10px;vertical-align:middle}
  .reftable td svg{height:74px;width:auto;max-width:100%;vertical-align:middle}
  .refcard{background:var(--paper2);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:4px;padding:10px 13px;margin:8px 0;font-size:13.5px;line-height:1.55}
  .refhd{font-family:var(--serif);font-weight:600;font-size:19px;margin:14px 0 2px}
  .keygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
  .keycell{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;text-align:center;font-size:12.5px;font-weight:600;background:#fff}
  .keycell svg{height:64px;width:auto;display:block;margin:0 auto}
  .secgrid{border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:6px 0 4px}
  .secrow{display:flex;align-items:center;padding:8px 12px;font-size:14px;border-bottom:1px solid var(--rule)} .secrow:last-child{border-bottom:0}
  .secrow.sechead{background:var(--ink);color:var(--cream);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .secname{flex:1;font-weight:500} .secprog{width:70px;text-align:center;color:#4d463c} .secpct{width:70px;text-align:center;font-weight:700} .secbest{width:70px;text-align:center;color:var(--brass);font-weight:700}
  .logav svg{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px}
  /* settings */
  .setgrp{margin:12px 0}
  .setlabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
  .setchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{border:1px solid var(--rule);background:#fff;color:#4d463c;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans)}
  .chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .ytag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--brass);color:#1b1a18;border-radius:999px;padding:1px 6px;vertical-align:middle}
  .chip.on .ytag{background:var(--brass)}
  .ytag.ext{background:#8a8277;color:#fff}
  .tabs button.exam{border-color:var(--brass);color:var(--brass)} .tabs button.exam.on{background:var(--brass);color:var(--ink)}
  .exambar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--cream);border-radius:6px;padding:8px 14px;margin:0 0 10px;font-size:13px}
  .exambar b{font-family:var(--serif);font-size:19px;font-weight:600} .exambar .mk{color:var(--brass);font-weight:700} .exambar .tm{font-family:var(--serif);font-size:19px}
  .examtable{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0} .examtable td,.examtable th{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left} .examtable th{background:var(--ink);color:var(--cream);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600} .examtable td.r{text-align:right;font-weight:700}
  .examtotal{font-family:var(--serif);font-size:34px;font-weight:600;margin:6px 0}
  body.embed header,body.embed .topbar,body.embed .tabs,body.embed footer,body.embed #musicfx{display:none!important} body.embed main{padding-top:6px}
  .embedframe{width:100%;height:min(78vh,820px);border:1px solid var(--rule);border-radius:6px;background:#1b1a18}
  .dots .finishbtn{border:1px solid var(--brass);background:transparent;color:var(--brass);border-radius:999px;font-size:11px;font-weight:600;padding:5px 11px;cursor:pointer;font-family:var(--sans)}
  .setsel{padding:7px 10px;border:1px solid var(--rule);border-radius:6px;font-family:var(--sans);font-size:13px;background:#fff}
  /* avatar builder */
  .avgrid{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
  .avgrid .prev svg{width:150px;height:150px;border-radius:20px;display:block;box-shadow:0 8px 22px rgba(0,0,0,.2)}
  .avopt{margin:0 0 10px} .avopt .setlabel{margin-bottom:4px}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--rule);cursor:pointer;display:inline-block}
  .sw.on{box-shadow:0 0 0 2.5px var(--ink)}
  .avchip{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:var(--sans)}
  .avchip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  footer{flex:none;max-width:900px;margin:0 auto;padding:5px 16px 7px;color:#8f877a;font-size:11px;text-align:center}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:50}
  #musicfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #musicfx span{position:absolute;will-change:transform,opacity;animation:floatUp linear infinite;font-family:Georgia,serif}
  @keyframes floatUp{0%{transform:translateY(40px) rotate(-10deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-160px) rotate(25deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){#musicfx span{animation:none;opacity:.35}}
  main,header,footer{position:relative;z-index:2}
  #toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-10px);z-index:60;opacity:0;background:var(--cream);color:var(--ink);font-family:var(--serif);font-weight:600;font-size:20px;padding:10px 24px;border-radius:999px;box-shadow:0 12px 34px rgba(0,0,0,.45);transition:opacity .25s,transform .3s;pointer-events:none;border:1px solid var(--brass);white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}} .shake{animation:shake .4s}
  @keyframes winglow{0%{box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 0 rgba(61,107,69,.6)}100%{box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 14px rgba(61,107,69,0)}} .winglow{animation:winglow .6s}
  @media (max-width:600px){.avgrid{grid-template-columns:1fr}.avgrid .prev svg{width:110px;height:110px;margin:0 auto}
    header h1{font-size:27px}header .eye{font-size:9.5px;letter-spacing:1.8px}.hud{gap:12px}.hud .stat{min-width:44px}.hud .stat .val{font-size:19px}
    .card{padding:12px 12px 12px}.prompt{font-size:20px}.topbar{gap:8px}.namebar input{width:130px}.opts{grid-template-columns:1fr 1fr}.opts button{font-size:14px;padding:10px 10px}.mrow .term{flex-basis:46%;font-size:13.5px}.staveWrap svg{height:170px}}
  /* ---- Exam booklet skin: the WACE Question/Answer booklet layout, with MLSHS branding ---- */
  body.paper{background:#4f4f4f;--ink:#000;--paper:#fff;--paper2:#f4f4f4;--line:#000;--muted:#555;--rule:#9a9a9a;--shade:#ebebeb;--accent:#000;--ox:#000;--brass:#000;--cream:#fff;--green:#1d6b2d;--red:#b3261e;--serif:Arial,Helvetica,sans-serif;--sans:Arial,Helvetica,sans-serif}

<script>
const APP='theoryAll';
// ---- Exam: Section One Part B in the WACE shape (two score-based theory questions, ~9 marks each) ----
const EXAM={id:'exam',name:'Exam',short:'Exam',exam:true,yr:11,guide:`<b>Exam practice — Section One, Part B: Theory</b><ul><li>Two questions of about nine marks each, built from the kinds of parts the paper asks: name chords and intervals at points in a score, time signature, symbols and articulations, TAB or chord diagrams, devices, writing named chords on different clefs, and a transposition rewrite worth four marks.</li><li>Marks are awarded in proportion to what you get right. The paper allows roughly 20 minutes for Part B; the clock runs from Start.</li></ul>`};
// ---- special sections: a daily set for the whole class, and a set built from your own weak spots ----
const TODAY={id:'today',name:"Today's Blitz",short:"Today's Blitz",special:true,yr:7,guide:`<b>Today's Blitz</b><ul><li>Ten questions drawn from every unit, the same ten for everyone in your year today.</li><li>Answer at least five and today counts towards your <b>days in a row</b>.</li><li>Come back tomorrow for a new set.</li></ul>`,
  make(){const real=REAL().filter(u=>unitOn(UNITS.indexOf(u)));const out=[];for(let pos=0;pos<10;pos++){const key=todayStr()+'|'+LEVEL()+'|'+pos;const u=real[hashStr(key+'|unit')%real.length];const q=withSeed(hashStr(key),()=>{Math.random();Math.random();return GEN.makeSet(u.id,1)[0];});if(q)out.push(q);}return out;}};
const WEAK={id:'weak',name:'Weak spots',short:'Weak spots',special:true,yr:7,guide:`<b>Weak spots</b><ul><li>Questions from the three units where your recent accuracy is lowest.</li><li>The mastery rings on the tabs show how each unit is going (your last 20 answers).</li></ul>`,
  make(){const real=REAL().filter(u=>unitOn(UNITS.indexOf(u)));const sc=real.map(u=>({u,m:mastery(u.id)})).filter(x=>x.m.n>=3).sort((a,b)=>a.m.acc-b.m.acc).slice(0,3).map(x=>x.u);const pool=sc.length?sc:real;const out=[];let g=0;const seen=new Set();
    while(out.length<SETN&&g++<SETN*5){const u=pool[Math.floor(Math.random()*pool.length)];const q=GEN.makeSet(u.id,1)[0];if(!q)continue;const key=q.prompt+'|'+(q.answer||'');if(seen.has(key))continue;seen.add(key);out.push(q);}return out;}};
// ---- Class task: a locked set the teacher shares as a link / QR / code (see task.js) ----
const TASKT={id:'task',name:'Class task',short:'Class task',special:true,task:true,yr:7,guide:`<b>Class task</b><ul><li>Your teacher set these questions. The first answer you give to each one is the one that counts.</li><li>Your answers are saved on this device as you go: if you close the app, open the task link again to carry on.</li><li>At the end you get a sealed result code to show or hand in.</li></ul>`,
  make(){const R=window.TaskKit&&TaskKit.run;if(!R)return [];const out=[];
    R.task.s.forEach((sec,si)=>{const it=R.items.find(x=>x.si===si);let qs=withSeed(it.secSeed,()=>GEN.makeSet(sec.u,sec.n));let t=1;while(qs.length<sec.n&&t<5){qs=qs.concat(withSeed(it.secSeed+t*7919,()=>GEN.makeSet(sec.u,sec.n-qs.length)));t++;}
      qs.slice(0,sec.n).forEach(q=>{q.unit=sec.u;out.push(q);});});return out;}};
// ---- Years 7–10 Aural and Theory Test (runs on the Exam engine; look standardised by testkit.js) ----
const TEST={id:'test',name:'Test',short:'Test',exam:true,test:true,special:true,yr:7,guide:`<b>Aural and Theory Test</b><ul><li>A full test in the school's standard format: an Aural section, then a Theory section, with the marks for each part shown.</li><li>Questions follow your year's curriculum. Every new test is different; your teacher can print the same test, with an answer key, from its test code.</li><li>Press Finish test when you are done: it is marked straight away.</li></ul>`};
const UNITS=[TODAY,WEAK].concat(GEN.UNITS,[EXAM,TEST,TASKT]);
const TASKI=()=>UNITS.indexOf(TASKT);
let taskPrev=null;
function taskOpen(){const R=TaskKit.run;SETQ=TASKT.make();SETQ.forId='task';
  Object.keys(scored).forEach(k=>{if(k.startsWith('task.'))delete scored[k];});Object.keys(results).forEach(k=>{if(k.startsWith('task.'))delete results[k];});delete uStat[ui];
  Object.entries(R.state.rec).forEach(([pos,r])=>{scored['task.'+pos]=!!r[3];results['task.'+pos]=r[3]?'ok':'no';});
  if(TaskKit.isDone()){showTaskFinish();return;}const f=TaskKit.firstOpen();qi=f<0?0:f;load();}
async function showTaskFinish(){renderTabs();document.getElementById('dots').innerHTML='';const c=document.getElementById('card');c.innerHTML=await TaskKit.finishHtml();TaskKit.wireFinish();c.scrollTop=0;burst('win',innerWidth/2,innerHeight/2,true);}

TaskKit.init({app:'theory',label:'Theory Blitz',years:[7,8,9,10,11,12],test:true,
  sections:()=>REAL().filter(u=>unitOn(UNITS.indexOf(u))).map(u=>({key:u.id,name:u.name})),
  sectionNames:()=>Object.fromEntries(REAL().map(u=>[u.id,u.name])),
  snapshot:()=>{const st=JSON.parse(JSON.stringify(GEN.getSet()));delete st.level;return {global:{set:st,gs:JSON.parse(JSON.stringify(GENSEL||{}))}};},
  year:()=>+LEVEL(),getName:()=>currentName,toast:t=>toast(t),companion:(typeof HAS_AURAL_DIR!=='undefined'&&HAS_AURAL_DIR&&/^https?:/.test(location.protocol))?'aural/index.html':'',
  setName:v=>{currentName=v;const ni=document.getElementById('nameinput');if(ni)ni.value=v;LS.set('name',v);loadProfile();paintScore();},
  start:run=>{if(window.BlitzUI)BlitzUI.showHome(false);closeGuide();if(sprintOn)endSprint(true);h2h=null;examOn=false;clearInterval(examTick);
    if(!taskPrev)taskPrev={ui,set:JSON.parse(JSON.stringify(GEN.getSet())),gs:JSON.parse(JSON.stringify(GENSEL||{}))};
    GEN.setLevel(String(run.task.y));if(run.task.tt){GENSEL={};GEN.setGensel(GENSEL);paintLevel();testRun={y:run.task.y,sem:run.task.sem||TestKit.semester(),seed:TaskKit.testSeed()};ui=UNITS.indexOf(TEST);SETQ=[];setMode('practise');taskTestSync();return;}
    if(run.task.g&&run.task.g.set)GEN.applySet(run.task.g.set);GENSEL=(run.task.g&&run.task.g.gs)||{};GEN.setGensel(GENSEL);paintLevel();ui=TASKI();SETQ=[];setMode('practise');},
  exit:()=>{setTimeout(()=>{if(window.BlitzUI)BlitzUI.showHome(true);},0);const pv=taskPrev;taskPrev=null;if(pv){GEN.setLevel(String(pv.set.level));GEN.applySet(pv.set);GENSEL=pv.gs;GEN.setGensel(GENSEL);}paintLevel();ui=pv&&pv.ui!==TASKI()?pv.ui:firstUnit();testRun={y:0,sem:'',seed:0};SETQ=[];setMode('practise');}});
document.getElementById('taskbtn').onclick=()=>TaskKit.openStudentEntry();

// ---- app-icon home screen (blitzui.js) ----
function unitIcon(u){const UICON={today:'sun',weak:'target',pitch:'pitch',rhythm:'rhythm',expr:'accent',keys:'sharp',scales:'stairs',intervals:'interval',chords:'chord',harmony:'roman',transp:'transpose',form:'form',exam:'cap',test:'clipboard'};return UICON[u.id]||(u.exam?'cap':'note');}
function goUnit(i){if(sprintOn)endSprint(true);h2h=null;if(examOn&&!UNITS[i].exam&&!confirm('Leave the exam? Your marks so far will be lost.'))return;examOn=false;clearInterval(examTick);
  if(mode!=='practise'){mode='practise';document.getElementById('mPr').classList.add('on');document.getElementById('mRe').classList.remove('on');document.getElementById('mRec').classList.remove('on');document.getElementById('dots').style.display='flex';document.getElementById('tabs').style.display='flex';}
  ui=i;BlitzUI.showHome(false);openUnit();}
function goHome(){if(examOn&&!confirm('Leave the '+(UNITS[ui]&&UNITS[ui].test?'test':'exam')+'? Your answers so far will be lost.'))return;if(sprintOn)endSprint(true);h2h=null;examOn=false;clearInterval(examTick);if(window.AUDIO)AUDIO.stop();
  if(mode!=='practise')setMode('practise');document.body.classList.remove('paper','testmode','testing');BlitzUI.showHome(true);}
const BPATH={7:['pitch','rhythm','keys','scales','intervals','chords','expr'],8:['pitch','rhythm','keys','scales','intervals','chords','expr','form'],9:['rhythm','keys','scales','intervals','chords','harmony','expr','form','transp'],10:['keys','scales','intervals','chords','harmony','transp','rhythm','form','expr','pitch'],11:['keys','scales','intervals','chords','harmony','transp','rhythm','form','expr','pitch'],12:['keys','scales','intervals','chords','harmony','transp','rhythm','form','expr','pitch']};
function homeSetName(v){currentName=v;const ni=document.getElementById('nameinput');if(ni)ni.value=v;LS.set('name',v);loadProfile();try{avatar=BlitzUI.loadAvatar(v);paintAvatar();}catch(e){}paintScore();}
BlitzUI.init({
  years:()=>[7,8,9,10,11,12],year:()=>+LEVEL(),setYear:y=>{setLevelUI(y);setTimeout(()=>BlitzUI.renderHome(),0);},setName:homeSetName,customise:()=>{const g=document.getElementById('gear');if(g)g.click();},
  toast:t=>toast(t),burst:()=>burst('win',innerWidth/2,innerHeight/2,true),
  reloadProfiles:()=>{try{PROFS=JSON.parse(localStorage.getItem('blitzAuralProfiles')||'{}');}catch(e){}loadProfile();},
  path:()=>{const kf=u=>u.id;const order=BPATH[+LEVEL()]||BPATH[12];const out=[];order.forEach((k,n)=>{const i=UNITS.findIndex(u=>kf(u)===k);if(i<0||UNITS[i].special)return;if(typeof unitOn==='function'&&!unitOn(i))return;const u=UNITS[i];out.push({i,name:u.short||u.name,icon:unitIcon(u),hue:i,m:PROF?mastery(kf(u)):null});});return out;},
  upNext:()=>{const kf=u=>u.id;const order=BPATH[+LEVEL()]||BPATH[12];let best=null;
    order.forEach(k=>{const i=UNITS.findIndex(u=>kf(u)===k);if(i<0)return;if(typeof unitOn==='function'&&!unitOn(i))return;const m=PROF?mastery(k):{n:0};if(m.n>=5&&m.acc<0.7&&(!best||best.weak&&m.acc<best.acc))best={i,acc:m.acc,weak:1,why:'Strengthen · '+Math.round(m.acc*100)+'% recently'};});
    if(!best){for(const k of order){const i=UNITS.findIndex(u=>kf(u)===k);if(i<0)continue;if(typeof unitOn==='function'&&!unitOn(i))continue;const m=PROF?mastery(k):{n:0};if(!m.mastered){best={i,why:m.n?'Keep going on your path':'Next on your path'};break;}}}
    if(!best){const i=UNITS.findIndex(u=>kf(u)==='today');if(i>=0)best={i,why:'Every section mastered · daily practice'};}
    if(!best)return null;const u=UNITS[best.i];return {i:best.i,name:u.short||u.name,icon:unitIcon(u),hue:best.i,why:best.why};},
  skillTitle:'Theory skills',
  units:()=>{const vis=(u,i)=>unitOn(i)&&!u.task&&!(u.test&&+LEVEL()>10);const out=[];UNITS.forEach((u,i)=>{if(!vis(u,i))return;const g=u.exam?'test':u.special?'daily':'skill';const m=g==='skill'&&PROF?(u=>mastery(u.id))(u):null;out.push({i,name:u.short||u.name,group:g,icon:unitIcon(u),m,hue:g==='skill'?i:undefined,sub:u.test?'Years 7–10':''});});
    out.push({i:-1,name:'Class task',group:'test',icon:'task',sub:'from your teacher'});return out;},
  open:i=>{if(i===-1){TaskKit.openStudentEntry();return;}goUnit(i);},
  home:goHome,
  tab:t=>{if(t==='learn'){goHome();}else if(t==='ref'){BlitzUI.showHome(false);setMode('reference');}else if(t==='rec'){BlitzUI.showHome(false);setMode('record');}else openAvatar();BlitzUI.paintTabbar();},
  currentTab:()=>mode==='practise'?'learn':mode==='reference'?'ref':'rec',
  stats:()=>{const T=id=>{const e=document.getElementById(id);return e?e.textContent:'';};const xp=PROF?PROF.xp:0;const r=rankOf(xp);const pct=r.next?(xp-r.at)/(r.next[0]-r.at):1;
    return {name:currentName,rank:r.name,xp,xpPct:pct,streak:typeof streak!=='undefined'?streak:0,days:BlitzUI.daysStreak(PROF&&PROF.days),acc:T('scp'),mastered:PROF?REAL().filter(u=>(u=>mastery(u.id))(u).mastered).length:0};}});
const _h0=location.hash;if(!EMBED)TaskKit.handleHash();
if(!EMBED&&!/#(task|verify|tkey)=/.test(_h0)&&!/[?&]nohome/.test(location.search)){BlitzUI.showHome(true);if(!currentName)setTimeout(()=>BlitzUI.pickProfile(true),400);}
</script>
</body>
